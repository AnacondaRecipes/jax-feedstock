{% set name = "jax" %}
{% set version = "0.12.0.1" %}

package:
  name: {{name}}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/j/jax/jax-{{ version }}.tar.gz
  sha256: f543fb1151c351d328b7dd9e40865c01bf9ae10cdf7e21637196172891d51914

build:
  number: 0
  skip: true  # [py<312]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
  run:
    - python
    - numpy >=2.2
    - opt_einsum
    - scipy >=1.15
    - ml_dtypes >=0.5.0
    - jaxlib >=0.11.2,<=0.12.0.1
  run_constrained:
    # Change to nvidia-cudnn-* in https://github.com/jax-ml/jax/blob/main/jax_plugins/cuda/plugin_setup.py
    - cudnn >=9.8,<10.0
    - jaxlib >=0.12.0.1,<=0.12.0.1
    - jax-cuda12-plugin >=0.12.0.1,<=0.12.0.1
    - jax-cuda13-plugin >=0.12.0.1,<=0.12.0.1
    - jax-oneapi-plugin >=0.12.0.1,<=0.12.0.1
    - jax-rocm7-plugin ==0.12.0.1.*
    - libtpu ==0.0.50.*

test:
  requires:
    - pip
  imports:
    - jax
    - jax._src
  commands:
    - pip check

about:
  home: https://github.com/jax-ml/jax
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: Differentiate, compile, and transform Numpy code
  description: |
    JAX is Autograd and XLA, brought together for high-performance numerical computing and machine learning research.
    It provides composable transformations of Python+NumPy programs: differentiate, vectorize, parallelize, Just-In-Time compile to GPU/TPU, and more.
  dev_url: https://github.com/jax-ml/jax
  doc_url: https://docs.jax.dev/en/latest/

extra:
  recipe-maintainers:
    - ocefpaf
    - ericmjl
